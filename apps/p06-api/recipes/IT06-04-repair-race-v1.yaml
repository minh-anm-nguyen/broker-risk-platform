# Fault recipe: a reconciliation repair lands while a report is computing.
#
# Design doc section 14.1. Deterministic barriers, not sleeps: the request is
# held at a named pipeline point, upstream state is mutated, then released.
#
# Run with:  python scripts/run_fault_recipe.py recipes/IT06-04-repair-race-v1.yaml
recipe_id: IT06-04-repair-race-v1
description: >
  Pin reconciliation revision recon-R10, hold the computed result at the
  post-compute barrier, land a blocking repair at recon-R11, then release. The
  report must not be emitted as current.

world:
  source_id: sim-broker-a
  epoch_id: E1
  position_scan_id: scan-P
  deal_watermark_seq: 1050
  recon_revision: recon-R10
  recon_blocking_reason: null
  quote_snapshot_id: quote-S1030

principal:
  subject: analyst-a
  roles: [risk_analyst]

action:
  method: GET
  path: /api/v1/accounts/00042/risk
  query:
    source_id: sim-broker-a

injections:
  - at: barrier.after_p05_compute
    action: barrier_hold
  - at: while_barrier_held
    action: bump_recon_revision
    revision: recon-R11
    blocking_reason: POSITION_MISMATCH
  - at: after_mutation
    action: barrier_release

expect:
  http_status: 409
  public_code: [DATA_NOT_READY, CUT_CHANGED, COMPOSITE_UNPROVEN]
  response_has_financial_amounts: false
  forbidden_in_body: ["56.00", "81.00", "POSITION_MISMATCH"]
  audit_decisions_exclude: [ALLOW]
  source_data_unchanged_by_api: true
  required_evidence:
    - injection_fired
    - revision_before
    - revision_after
    - http_capture
