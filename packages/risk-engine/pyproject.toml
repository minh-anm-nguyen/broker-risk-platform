[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "1.0.0"
description = "Project 05 reference Broker Risk Calculation Engine - pure Decimal domain library, no HTTP framework imports"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "hypothesis>=6.112"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs with a bare `pytest` from this directory, not only through
# the root Makefile. An uninstalled library whose tests cannot be run on their
# own is how a suite quietly stops being run at all.
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: excluded from the per-commit sweep",
    "performance: benchmark and load tests",
    # Declared although nothing here is marked with them. The root Makefile
    # filters every component with one expression, `-m "not slow and not
    # performance"`, and --strict-markers validates the names used in -m as
    # well as the ones applied to tests. Without these two lines pytest exits
    # with a usage error and this package silently never runs.
    "unit: fast in-process checks",
    "property: Hypothesis property tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
