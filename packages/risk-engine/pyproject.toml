[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "1.0.0"
description = "Project 05 reference Broker Risk Calculation Engine - pure Decimal domain library, no HTTP framework imports"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "hypothesis>=6.112"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
