[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-broker-simulator"
version = "1.0.0"
description = "Project 01 - MT5 Broker Simulator: deterministic, stateful synthetic broker data source with fault injection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.21",
    # Runtime, not test-only: /admin/v1/metrics publishes resident set size,
    # so a container built from the main dependencies alone must still start.
    "psutil>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.112",
]

[project.scripts]
simulator = "simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast in-process unit tests",
    "contract: HTTP/API contract tests",
    "integration: multi-component integration tests",
    "chaos: crash/storage/resource chaos tests (slow, subprocess)",
    "property: property-based / metamorphic tests",
    "performance: benchmark and load tests (slow)",
    "slow: excluded from the per-commit smoke suite",
]
filterwarnings = ["error::DeprecationWarning:simulator.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
